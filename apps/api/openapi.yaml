openapi: 3.1.0
info:
  title: SideQuest Party API
  version: 0.2.0
  description: API em memória para o onboarding multiusuário da Party.
servers:
  - url: http://localhost:3333
paths:
  /health:
    get:
      operationId: getHealth
      responses:
        "200":
          description: API disponível
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { const: ok }
  /parties:
    post:
      operationId: createParty
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePartyRequest" }
      responses:
        "201": { $ref: "#/components/responses/PartySessionResponse" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
  /parties/{partyId}:
    parameters:
      - $ref: "#/components/parameters/PartyId"
    get:
      operationId: getParty
      description: Endpoint público de polling; consultar a cada 1–2 segundos.
      responses:
        "200": { $ref: "#/components/responses/PartyResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
  /parties/{partyId}/join:
    parameters:
      - $ref: "#/components/parameters/PartyId"
    post:
      operationId: joinParty
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [participant]
              properties:
                participant: { $ref: "#/components/schemas/ParticipantIdentity" }
      responses:
        "200": { $ref: "#/components/responses/PartySessionResponse" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
  /parties/{partyId}/close:
    parameters:
      - $ref: "#/components/parameters/PartyId"
    post:
      operationId: closePartyMembership
      security:
        - participantToken: []
      description: Fecha o grupo com 2–4 participantes; somente o anfitrião pode executar.
      responses:
        "200": { $ref: "#/components/responses/PartyResponse" }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
  /parties/{partyId}/answers:
    parameters:
      - $ref: "#/components/parameters/PartyId"
    post:
      operationId: submitQuestionnaireAnswers
      security:
        - participantToken: []
      description: Substitui a resposta do participante identificado pelo token.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubmitAnswersRequest" }
      responses:
        "200": { $ref: "#/components/responses/PartyResponse" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
  /parties/{partyId}/mcp-connection:
    parameters:
      - $ref: "#/components/parameters/PartyId"
    post:
      operationId: registerMcpConnection
      security:
        - participantToken: []
      description: Registra uma chave write-only para o participante autenticado. A validação real será adicionada pelo adaptador MCP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [apiKey]
              properties:
                apiKey:
                  type: string
                  minLength: 1
                  writeOnly: true
      responses:
        "200":
          description: Chave armazenada e aguardando validação
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { const: validating }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
components:
  securitySchemes:
    participantToken:
      type: http
      scheme: bearer
      bearerFormat: opaque participant token
  parameters:
    PartyId:
      name: partyId
      in: path
      required: true
      description: UUID ou código de seis caracteres da Party.
      schema: { type: string }
  responses:
    PartyResponse:
      description: Estado público atual da Party
      content:
        application/json:
          schema: { $ref: "#/components/schemas/PartySnapshot" }
    PartySessionResponse:
      description: Estado público e token privado do participante atual
      content:
        application/json:
          schema:
            type: object
            required: [party, participantToken]
            properties:
              party: { $ref: "#/components/schemas/PartySnapshot" }
              participantToken:
                type: string
                writeOnly: true
    ErrorResponse:
      description: Erro de entrada, autorização, recurso ou estado
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
  schemas:
    PartyStatus:
      type: string
      enum: [OPEN, COLLECTING_ANSWERS, READY_FOR_THEME]
    McpConnectionStatus:
      type: string
      enum: [not_connected, validating, connected, error]
    ParticipantIdentity:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id: { type: string, minLength: 1 }
        name: { type: string, minLength: 1 }
    CreatePartyRequest:
      type: object
      additionalProperties: false
      required: [name, host]
      properties:
        name: { type: string, minLength: 1 }
        host: { $ref: "#/components/schemas/ParticipantIdentity" }
    SubmitAnswersRequest:
      type: object
      additionalProperties: false
      required: [questionnaireVersion, answers, completed]
      properties:
        questionnaireVersion: { type: string, minLength: 1 }
        answers: { type: object, additionalProperties: true }
        completed: { const: true }
    QuestionnaireResponse:
      allOf:
        - $ref: "#/components/schemas/SubmitAnswersRequest"
        - type: object
          required: [submittedAt]
          properties:
            submittedAt: { type: string, format: date-time }
    Participant:
      type: object
      required: [id, name, questionnaireResponse, mcpConnectionStatus]
      properties:
        id: { type: string }
        name: { type: string }
        questionnaireResponse:
          oneOf:
            - $ref: "#/components/schemas/QuestionnaireResponse"
            - type: "null"
        mcpConnectionStatus: { $ref: "#/components/schemas/McpConnectionStatus" }
    PartySnapshot:
      type: object
      required: [party, participants]
      properties:
        party:
          type: object
          required: [id, code, name, status, hostParticipantId, membershipLocked, createdAt]
          properties:
            id: { type: string, format: uuid }
            code: { type: string, minLength: 6, maxLength: 6 }
            name: { type: string }
            status: { $ref: "#/components/schemas/PartyStatus" }
            hostParticipantId: { type: string }
            membershipLocked: { type: boolean }
            createdAt: { type: string, format: date-time }
        participants:
          type: array
          minItems: 1
          maxItems: 4
          items: { $ref: "#/components/schemas/Participant" }
    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              examples: [ACCESS_TOKEN_REQUIRED, ACCESS_DENIED, PARTY_FULL, PARTY_CLOSED]
            message: { type: string }
            details: { type: object, additionalProperties: true }
