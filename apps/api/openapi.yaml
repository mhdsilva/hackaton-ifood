openapi: 3.1.0
info:
  title: SideQuest Party API
  version: 0.2.0
  description: API em memória para o onboarding multiusuário da Party.
servers:
  - url: http://localhost:3333
paths:
  /health:
    get:
      operationId: getHealth
      responses:
        "200":
          description: API disponível
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { const: ok }
  /questionnaire:
    get:
      operationId: getQuestionnaire
      description: |
        Definição do questionário atual, para o frontend renderizar o formulário
        dinamicamente sem fixar campos no cliente. As perguntas ainda são provisórias.
      parameters:
        - name: version
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Definição do questionário
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuestionnaireDefinition" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
  /parties:
    post:
      operationId: createParty
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePartyRequest" }
      responses:
        "201": { $ref: "#/components/responses/PartySessionResponse" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
  /parties/{partyId}:
    parameters:
      - $ref: "#/components/parameters/PartyId"
    get:
      operationId: getParty
      description: Endpoint público de polling; consultar a cada 1–2 segundos.
      responses:
        "200": { $ref: "#/components/responses/PartyResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
  /parties/{partyId}/session:
    parameters:
      - $ref: "#/components/parameters/PartyId"
    get:
      operationId: getParticipantSession
      security:
        - participantToken: []
      description: |
        Valida o Bearer do participante e devolve a identidade pública atual dele.
        Útil para o frontend detectar uma sessão expirada (estado em memória) ao carregar.
      responses:
        "200":
          description: Participante identificado pelo token
          content:
            application/json:
              schema:
                type: object
                required: [participant]
                properties:
                  participant: { $ref: "#/components/schemas/Participant" }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
  /parties/{partyId}/addresses:
    parameters:
      - $ref: "#/components/parameters/PartyId"
    get:
      operationId: listParticipantAddresses
      security:
        - participantToken: []
      description: |
        Lista os endereços da conta iFood conectada pelo próprio participante. Devolve somente
        `addressId`, rótulo (alias ou bairro/cidade) e indicação de último uso; não expõe rua,
        número, CEP ou coordenadas. No modo demo devolve o endereço sintético de São Carlos.
      responses:
        "200":
          description: Endereços sanitizados disponíveis para seleção
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ParticipantAddressesResponse" }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
    post:
      operationId: createParticipantAddress
      security:
        - participantToken: []
      description: |
        Confirma um candidato devolvido por `POST /parties/{partyId}/addresses/resolve` e salva
        o endereço na conta iFood deste participante. Exige `candidateId` para nunca persistir
        antes da confirmação. Repetir a mesma confirmação é idempotente: responde `200` com
        `alreadyExists: true`; a primeira criação responde `201`. O corpo aceita `address`,
        `candidateId` e, opcionalmente, `neighborhood`, `alias`, `complement` e `reference`.
        A resposta só expõe `addressId` e rótulo; os detalhes completos não voltam ao estado Party.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateParticipantAddressRequest" }
      responses:
        "200":
          description: Endereço já havia sido criado por uma tentativa idempotente
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreateParticipantAddressResponse" }
        "201":
          description: Endereço criado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreateParticipantAddressResponse" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
        "422": { $ref: "#/components/responses/ErrorResponse" }
        "502": { $ref: "#/components/responses/ErrorResponse" }
        "503": { $ref: "#/components/responses/ErrorResponse" }
  /parties/{partyId}/addresses/resolve:
    parameters:
      - $ref: "#/components/parameters/PartyId"
    post:
      operationId: resolveParticipantAddress
      security:
        - participantToken: []
      description: |
        Envia um endereço em texto livre à tool `createAddress` para geocodificação, sem persistir.
        Retorna candidatos para a pessoa confirmar na própria tela. Não retorna coordenadas.
        Use `candidateId` e reenvie o mesmo `address` em `POST /parties/{partyId}/addresses`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [address]
              properties:
                address: { type: string, minLength: 1, maxLength: 500 }
      responses:
        "200":
          description: Candidatos encontrados (ou lista vazia se não houver correspondência)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AddressResolutionResponse" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
        "502": { $ref: "#/components/responses/ErrorResponse" }
        "503": { $ref: "#/components/responses/ErrorResponse" }
  /parties/{partyId}/join:
    parameters:
      - $ref: "#/components/parameters/PartyId"
    post:
      operationId: joinParty
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [participant]
              properties:
                participant: { $ref: "#/components/schemas/ParticipantIdentity" }
      responses:
        "200": { $ref: "#/components/responses/PartySessionResponse" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
  /parties/{partyId}/close:
    parameters:
      - $ref: "#/components/parameters/PartyId"
    post:
      operationId: closePartyMembership
      security:
        - participantToken: []
      description: Fecha o grupo com 2–4 participantes; somente o anfitrião pode executar.
      responses:
        "200": { $ref: "#/components/responses/PartyResponse" }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
  /parties/{partyId}/answers:
    parameters:
      - $ref: "#/components/parameters/PartyId"
    post:
      operationId: submitQuestionnaireAnswers
      security:
        - participantToken: []
      description: Substitui a resposta do participante identificado pelo token.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubmitAnswersRequest" }
      responses:
        "200": { $ref: "#/components/responses/PartyResponse" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
  /parties/{partyId}/reveal:
    parameters:
      - $ref: "#/components/parameters/PartyId"
    post:
      operationId: revealPartyResult
      security:
        - participantToken: []
      description: |
        O host revela o resultado a partir de `READY_FOR_THEME`, levando a Party a
        `THEME_REVEALED`. Só o host pode executar; outro participante recebe `403`.
        Fora de `READY_FOR_THEME` (inclusive uma segunda revelação) recebe `409`.
      responses:
        "200": { $ref: "#/components/responses/PartyResponse" }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
  /parties/{partyId}/mcp-connection/authorize:
    parameters:
      - $ref: "#/components/parameters/PartyId"
    post:
      operationId: authorizeMcpConnection
      security:
        - participantToken: []
      description: |
        Inicia o OAuth 2.1 com PKCE para o participante identificado pelo Bearer token.
        O backend mantém o state e o code_verifier vinculados à sessão do participante.
        O campo `mode` indica se a conexão é real (`ifood`) ou apenas de demonstração (`demo`).
      responses:
        "200":
          description: URL de autorização criada para o participante
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [authorizationUrl, status, mode]
                properties:
                  authorizationUrl:
                    type: string
                    format: uri
                  status: { const: validating }
                  mode:
                    type: string
                    enum: [demo, ifood]
                    description: Modo da conexão MCP; `demo` usa tokens sintéticos.
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
  /parties/{partyId}/mcp-connection/callback:
    parameters:
      - $ref: "#/components/parameters/PartyId"
    get:
      operationId: completePartyMcpConnection
      deprecated: true
      security: []
      description: |
        Rota antiga, mantida por compatibilidade. Use `/mcp-connection/callback`: o iFood
        compara a redirect URI inteira, então ela não pode variar por Party.
      parameters:
        - name: code
          in: query
          required: true
          schema: { type: string, minLength: 1 }
        - name: state
          in: query
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        "302":
          description: Redireciona o navegador de volta à Party após concluir a conexão
          headers:
            Location:
              required: true
              description: Destino do frontend com o resultado da conexão OAuth.
              schema: { type: string, format: uri-reference }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
  /mcp-connection/callback:
    get:
      operationId: completeMcpConnection
      security: []
      description: |
        Callback OAuth único, cadastrado no agente do iFood como
        `PUBLIC_API_URL/mcp-connection/callback`. A Party e o participante vêm do `state`.
        Troca o code pelos tokens, valida a conexão com uma leitura no iFood (modo `ifood`) e
        redireciona ao frontend com `mcp=connected` ou `mcp=error`. Não exige Bearer porque é
        chamado pelo redirecionamento do servidor de autorização.

        Em modo `ifood`, a API atende no **caminho** da `IFOOD_REDIRECT_URI` cadastrada
        (`server.callbackPath = new URL(IFOOD_REDIRECT_URI).pathname`), que pode diferir de
        `/mcp-connection/callback`; este caminho só é o padrão em modo demo.
      parameters:
        - name: code
          in: query
          required: true
          schema: { type: string, minLength: 1 }
        - name: state
          in: query
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        "302":
          description: Redireciona o navegador de volta à Party após concluir a conexão
          headers:
            Location:
              required: true
              description: Destino do frontend com `partyId` e `mcp` (connected ou error).
              schema: { type: string, format: uri-reference }
        "400": { $ref: "#/components/responses/ErrorResponse" }
  /parties/{partyId}/options:
    parameters:
      - $ref: "#/components/parameters/PartyId"
    post:
      operationId: resolveLocalOptions
      security:
        - participantToken: []
      description: |
        Opções reais do tema perto do endereço do participante, usando somente a sessão MCP dele.
        No modo `demo`, ou se o iFood falhar, devolve opções capturadas com `source: simulated`.
        Com mais de um endereço salvo, responde `409 ADDRESS_SELECTION_REQUIRED` com
        `details.candidates` (só alias ou bairro e cidade) para o participante escolher.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [budget]
              properties:
                theme:
                  type: string
                  minLength: 1
                  description: |
                    Ignorado quando a Party já tem tema: o resultado da revelação vence.
                    Serve só como fallback (ex.: antes de revelar, ou em teste).
                budget:
                  type: number
                  exclusiveMinimum: 0
                  description: Orçamento total em BRL, incluindo frete.
                restrictions:
                  type: array
                  items: { type: string }
                addressId: { type: string }
                maxOptions: { type: integer, minimum: 1, maximum: 5 }
      responses:
        "200":
          description: Opções do participante
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResolveOptionsOutput" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
        "422": { $ref: "#/components/responses/ErrorResponse" }
        "503": { $ref: "#/components/responses/ErrorResponse" }
        "504": { $ref: "#/components/responses/ErrorResponse" }
  /parties/{partyId}/cart:
    parameters:
      - $ref: "#/components/parameters/PartyId"
    post:
      operationId: prepareCart
      security:
        - participantToken: []
      description: |
        Cria o carrinho do participante para uma opção devolvida por `/options` e define entrega e
        pagamento (Pix). Não envia o pedido nem cobra nada. No modo `demo`, `simulated` é `true`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [option]
              properties:
                option: { $ref: "#/components/schemas/LocalOption" }
                addressId: { type: string }
      responses:
        "200":
          description: Carrinho pronto para confirmação
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [cartId, merchantId, deliveryMethodId, paymentMethod, simulated]
                properties:
                  cartId: { type: string }
                  merchantId: { type: string }
                  deliveryMethodId: { type: string }
                  paymentMethod: { type: string }
                  total:
                    type: number
                    description: |
                      Valor final do iFood, já com taxa de serviço e benefícios. Pode diferir do
                      `total` estimado em `/options`.
                  breakdown:
                    type: object
                    additionalProperties: false
                    properties:
                      items: { type: number }
                      delivery: { type: number }
                      fees: { type: number }
                      benefits: { type: number }
                      vouchers: { type: number }
                  simulated: { type: boolean }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
        "422": { $ref: "#/components/responses/ErrorResponse" }
        "502": { $ref: "#/components/responses/ErrorResponse" }
  /parties/{partyId}/order:
    parameters:
      - $ref: "#/components/parameters/PartyId"
    post:
      operationId: submitOrder
      security:
        - participantToken: []
      description: |
        Envia o pedido do carrinho. Exige `userConsent: true` dado pelo próprio participante; sem
        isso responde `400 CONSENT_REQUIRED` e o iFood nem é chamado.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cartId, userConsent]
              properties:
                cartId: { type: string, minLength: 1 }
                userConsent: { const: true }
      responses:
        "201":
          description: Pedido criado
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [orderId, simulated]
                properties:
                  orderId: { type: string }
                  simulated: { type: boolean }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "502": { $ref: "#/components/responses/ErrorResponse" }
  /parties/{partyId}/order/{orderId}:
    parameters:
      - $ref: "#/components/parameters/PartyId"
      - name: orderId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: trackOrder
      security:
        - participantToken: []
      description: |
        Status resumido do pedido do participante. Consultar de novo após `retryAfterSeconds`
        e parar quando `terminal` for `true`. Mostrar `description`, nunca `statusCode`.
      responses:
        "200":
          description: Status atual
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [orderId, statusCode, description, terminal, simulated]
                properties:
                  orderId: { type: string }
                  statusCode: { type: string }
                  description: { type: string }
                  retryAfterSeconds: { type: integer }
                  terminal: { type: boolean }
                  pixCode:
                    type: string
                    description: Pix "copia e cola" enquanto o pagamento está pendente.
                  simulated: { type: boolean }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
  /parties/{partyId}/retrospective:
    parameters:
      - $ref: "#/components/parameters/PartyId"
    get:
      operationId: getPartyRetrospective
      security:
        - participantToken: []
      description: |
        Resumo factual da Party, acessível a qualquer participante autenticado. Retorna
        `waiting_for_deliveries` até o tema ter sido revelado e cada participante ter um pedido
        com status `CONCLUDED`; depois retorna `ready` e agregados do grupo. Não inclui feedback,
        endereços, coordenadas individuais, tokens, IDs de pedido ou valores individuais. A maior
        distância usa as coordenadas dos endereços escolhidos e é aproximada em linha reta.
      responses:
        "200":
          description: Estado de prontidão ou retrospectiva agregada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PartyRetrospectiveResponse" }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
components:
  securitySchemes:
    participantToken:
      type: http
      scheme: bearer
      bearerFormat: opaque participant token
  parameters:
    PartyId:
      name: partyId
      in: path
      required: true
      description: UUID ou código de seis caracteres da Party.
      schema: { type: string }
  responses:
    PartyResponse:
      description: Estado público atual da Party
      content:
        application/json:
          schema: { $ref: "#/components/schemas/PartySnapshot" }
    PartySessionResponse:
      description: Estado público e token privado do participante atual
      content:
        application/json:
          schema:
            type: object
            required: [party, participantToken]
            properties:
              party: { $ref: "#/components/schemas/PartySnapshot" }
              participantToken:
                type: string
    ErrorResponse:
      description: Erro de entrada, autorização, recurso ou estado
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
  schemas:
    PartyStatus:
      type: string
      enum: [OPEN, COLLECTING_ANSWERS, READY_FOR_THEME, THEME_REVEALED]
    McpConnectionStatus:
      type: string
      enum: [not_connected, validating, connected, error]
    QuestionnaireQuestionOption:
      type: object
      required: [id, label]
      properties:
        id: { type: string }
        label: { type: string }
        value:
          type: number
          description: "Significado numérico da opção (ex.: faixa de orçamento)."
    QuestionnaireTextInput:
      type: object
      required: [label, placeholder]
      properties:
        label: { type: string }
        placeholder: { type: string }
    QuestionnaireCustomInput:
      type: object
      required: [label, placeholder, min, max]
      properties:
        label: { type: string }
        placeholder: { type: string }
        min: { type: number }
        max: { type: number }
    QuestionnaireQuestion:
      type: object
      required: [id, type, label, required]
      properties:
        id: { type: string }
        type:
          type: string
          enum: [text, address, single_choice, multi_choice, scale]
        label: { type: string }
        required: { type: boolean }
        helpText: { type: string }
        options:
          type: array
          items: { $ref: "#/components/schemas/QuestionnaireQuestionOption" }
        min: { type: number }
        max: { type: number }
        maxSelections:
          type: integer
          minimum: 1
          description: '`multi_choice`: teto de seleções (ex.: Etapa 6 = 2).'
        allowOther:
          type: boolean
          description: Abre um campo de texto quando a opção `otherOptionId` é escolhida.
        otherOptionId:
          type: string
          description: Id da opção "Outro"; padrão `outro`.
        otherInput: { $ref: "#/components/schemas/QuestionnaireTextInput" }
        customInput:
          allOf:
            - $ref: "#/components/schemas/QuestionnaireCustomInput"
          description: '`single_choice`: "Outro valor" digitado, validado por faixa.'
      description: |
        O texto do "Outro" vai em `answers["<questionId>__other"]` (string) e o
        valor do "Outro valor" em `answers["<questionId>__value"]` (number).
    QuestionnaireDefinition:
      type: object
      required: [version, title, questions]
      properties:
        version: { type: string }
        title: { type: string }
        introduction: { type: string }
        questions:
          type: array
          items: { $ref: "#/components/schemas/QuestionnaireQuestion" }
    ParticipantIdentity:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id: { type: string, minLength: 1 }
        name: { type: string, minLength: 1 }
    CreatePartyRequest:
      type: object
      additionalProperties: false
      required: [name, host]
      properties:
        name: { type: string, minLength: 1 }
        host: { $ref: "#/components/schemas/ParticipantIdentity" }
    SubmitAnswersRequest:
      type: object
      additionalProperties: false
      required: [questionnaireVersion, answers, completed]
      properties:
        questionnaireVersion: { type: string, minLength: 1 }
        answers: { type: object, additionalProperties: true }
        completed:
          type: boolean
          description: '`true` conclui; `false` salva um rascunho (progresso incremental).'
    QuestionnaireResponse:
      type: object
      additionalProperties: false
      required: [questionnaireVersion, answers, completed, submittedAt]
      properties:
        questionnaireVersion: { type: string, minLength: 1 }
        answers: { type: object, additionalProperties: true }
        completed: { type: boolean }
        submittedAt: { type: string, format: date-time }
    Participant:
      type: object
      required: [id, name, questionnaireResponse, mcpConnectionStatus]
      properties:
        id: { type: string }
        name: { type: string }
        questionnaireResponse:
          oneOf:
            - $ref: "#/components/schemas/QuestionnaireResponse"
            - type: "null"
        mcpConnectionStatus: { $ref: "#/components/schemas/McpConnectionStatus" }
        answeredCount:
          type: integer
          minimum: 0
          description: Quantas perguntas da definição o participante já respondeu.
        orderStage:
          type: string
          enum: [none, options_ready, cart_created, order_submitted, delivered]
          description: "Estágio do participante depois de READY_FOR_THEME (opções, carrinho, pedido, entrega)."
        orderId:
          type: string
          description: Id do pedido do participante, quando já submetido.
        orderStatus:
          type: string
          description: Último status.code do trackOrder do iFood, quando houver.
    PartySnapshot:
      type: object
      required: [party, participants]
      properties:
        party:
          type: object
          required: [id, code, name, status, hostParticipantId, membershipLocked, createdAt]
          properties:
            id: { type: string, format: uuid }
            code: { type: string, minLength: 6, maxLength: 6 }
            name: { type: string }
            status: { $ref: "#/components/schemas/PartyStatus" }
            hostParticipantId: { type: string }
            membershipLocked: { type: boolean }
            createdAt: { type: string, format: date-time }
            theme:
              type: string
              description: Tema comum, gravado quando o host revela o resultado (POST /parties/{partyId}/reveal).
            themeReason:
              type: string
              description: |
                Por que o agente escolheu esse tema (uma frase), quando o reveal usou LLM.
                Ausente quando o tema veio da regra determinística.
        participants:
          type: array
          minItems: 1
          maxItems: 4
          items: { $ref: "#/components/schemas/Participant" }
    ParticipantAddress:
      type: object
      additionalProperties: false
      required: [addressId, label, isLastUsedAddress]
      properties:
        addressId: { type: string }
        label: { type: string }
        isLastUsedAddress: { type: boolean }
    ParticipantAddressesResponse:
      type: object
      additionalProperties: false
      required: [addresses]
      properties:
        addresses:
          type: array
          items: { $ref: "#/components/schemas/ParticipantAddress" }
    AddressCandidate:
      type: object
      additionalProperties: false
      required: [candidateId, formattedAddress]
      properties:
        candidateId: { type: string }
        formattedAddress: { type: string }
        neighborhood: { type: string, description: Pode vir vazio; se vier, solicite o bairro antes de confirmar. }
        city: { type: string }
        state: { type: string }
    AddressResolutionResponse:
      type: object
      additionalProperties: false
      required: [matchConfidence, candidates, simulated]
      properties:
        matchConfidence:
          type: string
          enum: [NONE, SINGLE, MULTIPLE]
        candidates:
          type: array
          items: { $ref: "#/components/schemas/AddressCandidate" }
        simulated: { type: boolean }
    CreateParticipantAddressRequest:
      type: object
      additionalProperties: false
      required: [address, candidateId]
      properties:
        address: { type: string, minLength: 1, maxLength: 500 }
        candidateId: { type: string, minLength: 1, maxLength: 200 }
        neighborhood: { type: string, maxLength: 120 }
        alias: { type: string, maxLength: 80 }
        complement: { type: string, maxLength: 160 }
        reference: { type: string, maxLength: 200 }
    CreateParticipantAddressResponse:
      type: object
      additionalProperties: false
      required: [address, alreadyExists, simulated]
      properties:
        address: { $ref: "#/components/schemas/ParticipantAddress" }
        alreadyExists: { type: boolean }
        simulated: { type: boolean }
    PartyRetrospectiveSummary:
      type: object
      additionalProperties: false
      required: [partyName, participantCount, completedOrderCount, itemCount, merchantCount]
      properties:
        partyName: { type: string }
        theme: { type: string }
        participantCount: { type: integer, minimum: 1, maximum: 4 }
        completedOrderCount: { type: integer, minimum: 1, maximum: 4 }
        itemCount:
          type: integer
          minimum: 1
          description: Soma das quantidades nas opções usadas para preparar os carrinhos.
        merchantCount: { type: integer, minimum: 1 }
        maxDistanceKm:
          type: number
          minimum: 0
          description: Maior distância aproximada em linha reta entre endereços; omitida se faltar alguma coordenada.
    PartyRetrospectiveResponse:
      type: object
      additionalProperties: false
      required: [state, pendingDeliveryCount]
      properties:
        state:
          type: string
          enum: [waiting_for_deliveries, ready]
        pendingDeliveryCount:
          type: integer
          minimum: 0
          description: Participantes sem pedido concluído; inclui quem ainda não enviou pedido.
        summary: { $ref: "#/components/schemas/PartyRetrospectiveSummary" }
    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              examples: [ACCESS_TOKEN_REQUIRED, ACCESS_DENIED, PARTY_FULL, PARTY_CLOSED]
            message: { type: string }
            details: { type: object, additionalProperties: true }
    ResolveOptionsOutput:
      type: object
      additionalProperties: false
      required: [participantId, source, theme, options, warnings]
      properties:
        participantId: { type: string }
        source:
          type: string
          enum: [live, simulated]
        theme: { type: string }
        warnings:
          type: array
          items: { type: string }
        options:
          type: array
          items: { $ref: "#/components/schemas/LocalOption" }
    LocalOption:
      type: object
      additionalProperties: false
      required:
        - merchant
        - items
        - subtotal
        - deliveryFee
        - total
        - minimumOrderAmount
        - deliveryMethodId
        - estimatedDeliveryMinutes
      properties:
        merchant:
          type: object
          additionalProperties: false
          required: [id, name, distanceKm]
          properties:
            id: { type: string }
            name: { type: string }
            distanceKm: { type: number }
            rating: { type: number }
        items:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [itemId, name, quantity, unitPrice, selectedOptions]
            properties:
              itemId: { type: string }
              name: { type: string }
              quantity: { type: integer, minimum: 1 }
              unitPrice: { type: number }
              selectedOptions:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [optionGroupId, optionId, name, additionalPrice]
                  properties:
                    optionGroupId: { type: string }
                    optionId: { type: string }
                    name: { type: string }
                    additionalPrice: { type: number }
        subtotal: { type: number }
        deliveryFee: { type: number }
        total: { type: number }
        minimumOrderAmount: { type: number }
        deliveryMethodId: { type: string }
        estimatedDeliveryMinutes:
          type: object
          additionalProperties: false
          required: [min, max]
          properties:
            min: { type: number }
            max: { type: number }
