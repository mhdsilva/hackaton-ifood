openapi: 3.1.0
info:
  title: SideQuest Party API
  version: 0.1.0
  description: Contrato do Sprint 0 para coordenar uma Party em memória.
servers:
  - url: http://localhost:3333
paths:
  /health:
    get:
      operationId: getHealth
      responses:
        "200":
          description: API disponível
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { const: ok }
  /parties:
    post:
      operationId: createParty
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePartyRequest" }
      responses:
        "201": { $ref: "#/components/responses/PartyResponse" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
  /parties/{partyId}:
    parameters:
      - $ref: "#/components/parameters/PartyId"
    get:
      operationId: getParty
      responses:
        "200": { $ref: "#/components/responses/PartyResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
  /parties/{partyId}/join:
    parameters:
      - $ref: "#/components/parameters/PartyId"
    post:
      operationId: joinParty
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [participant]
              properties:
                participant: { $ref: "#/components/schemas/ParticipantIdentity" }
      responses:
        "200": { $ref: "#/components/responses/PartyResponse" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
  /parties/{partyId}/answers:
    parameters:
      - $ref: "#/components/parameters/PartyId"
    post:
      operationId: saveAnswers
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaveAnswersRequest" }
      responses:
        "200": { $ref: "#/components/responses/PartyResponse" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
  /parties/{partyId}/plan:
    parameters:
      - $ref: "#/components/parameters/PartyId"
    post:
      operationId: planParty
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlanPartyRequest" }
      responses:
        "200": { $ref: "#/components/responses/PartyResponse" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
  /parties/{partyId}/ready:
    parameters:
      - $ref: "#/components/parameters/PartyId"
    post:
      operationId: setParticipantReady
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [participantId, ready]
              properties:
                participantId: { type: string }
                ready: { type: boolean }
      responses:
        "200": { $ref: "#/components/responses/PartyResponse" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
  /parties/{partyId}/order-status:
    parameters:
      - $ref: "#/components/parameters/PartyId"
    post:
      operationId: setOrderStatus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [participantId, status]
              properties:
                participantId: { type: string }
                status: { $ref: "#/components/schemas/OrderStatus" }
      responses:
        "200": { $ref: "#/components/responses/PartyResponse" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
  /parties/{partyId}/advance:
    parameters:
      - $ref: "#/components/parameters/PartyId"
    post:
      operationId: advanceParty
      description: Avança exatamente um estado quando suas condições mínimas forem satisfeitas.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                targetStatus: { $ref: "#/components/schemas/PartyStatus" }
      responses:
        "200": { $ref: "#/components/responses/PartyResponse" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
components:
  parameters:
    PartyId:
      name: partyId
      in: path
      required: true
      schema: { type: string }
  responses:
    PartyResponse:
      description: Estado atualizado da Party
      content:
        application/json:
          schema: { $ref: "#/components/schemas/PartySnapshot" }
    ErrorResponse:
      description: Erro de entrada, recurso ou transição
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
  schemas:
    PartyStatus:
      type: string
      enum: [LOBBY, COLLECTING_ANSWERS, PLANNING, REVIEWING_CARTS, ORDERING, WAITING_DELIVERIES, READY_TO_PLAY, PLAYING, COMPLETED]
    OrderStatus:
      type: string
      enum: [submitted, confirmed, preparing, dispatched, delivered, cancelled]
    ParticipantIdentity:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id: { type: string, minLength: 1 }
        name: { type: string, minLength: 1 }
    CreatePartyRequest:
      type: object
      additionalProperties: false
      required: [name, host]
      properties:
        name: { type: string, minLength: 1 }
        host: { $ref: "#/components/schemas/ParticipantIdentity" }
    QuestionnaireAnswers:
      type: object
      additionalProperties: false
      required: [budget, restrictions, category, surpriseLevel, vibe]
      properties:
        budget: { type: number, exclusiveMinimum: 0 }
        restrictions:
          type: array
          items: { type: string }
        category:
          type: string
          enum: [restaurant, market, sweets_and_drinks, surprise]
        surpriseLevel:
          type: string
          enum: [safe, curious, chaotic]
        vibe:
          type: string
          enum: [competitive, cooperative, conversation, discover, improvise]
    SaveAnswersRequest:
      type: object
      additionalProperties: false
      required: [participantId, answers]
      properties:
        participantId: { type: string }
        answers: { $ref: "#/components/schemas/QuestionnaireAnswers" }
    Mission:
      type: object
      additionalProperties: false
      required: [name, mode, roles]
      properties:
        name: { type: string }
        mode: { type: string, enum: [competitive, cooperative, conversation] }
        roles:
          type: array
          minItems: 1
          items: { type: string }
    ResolvedKit:
      type: object
      additionalProperties: false
      required: [merchant, items, total, estimatedDeliveryMinutes]
      properties:
        merchant:
          type: object
          required: [id, name]
          properties:
            id: { type: string }
            name: { type: string }
        items:
          type: array
          items:
            type: object
            required: [role, itemId, name, price]
            properties:
              role: { type: string }
              itemId: { type: string }
              name: { type: string }
              price: { type: number, minimum: 0 }
        total: { type: number, minimum: 0 }
        estimatedDeliveryMinutes: { type: integer, minimum: 0 }
    PlanPartyRequest:
      type: object
      additionalProperties: false
      required: [mission, kits]
      properties:
        mission: { $ref: "#/components/schemas/Mission" }
        kits:
          type: array
          items:
            type: object
            required: [participantId, kit]
            properties:
              participantId: { type: string }
              kit: { $ref: "#/components/schemas/ResolvedKit" }
    Participant:
      type: object
      required: [id, name, budget, restrictions, cartStatus, orderStatus, total, etaMinutes]
      properties:
        id: { type: string }
        name: { type: string }
        budget: { type: [number, "null"] }
        restrictions:
          type: array
          items: { type: string }
        answers: { $ref: "#/components/schemas/QuestionnaireAnswers" }
        cartStatus: { type: string, enum: [pending, resolving, ready, confirmed, failed] }
        orderStatus:
          oneOf:
            - $ref: "#/components/schemas/OrderStatus"
            - type: "null"
        total: { type: [number, "null"] }
        etaMinutes: { type: [integer, "null"] }
        kit: { $ref: "#/components/schemas/ResolvedKit" }
    PartySnapshot:
      type: object
      required: [party, participants, mission]
      properties:
        party:
          type: object
          required: [id, code, name, status]
          properties:
            id: { type: string }
            code: { type: string }
            name: { type: string }
            status: { $ref: "#/components/schemas/PartyStatus" }
            hostParticipantId: { type: string }
            createdAt: { type: string, format: date-time }
        participants:
          type: array
          items: { $ref: "#/components/schemas/Participant" }
        mission:
          oneOf:
            - $ref: "#/components/schemas/Mission"
            - type: "null"
    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: object, additionalProperties: true }
